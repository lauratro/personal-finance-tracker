services:
  postgres:
    image: postgres:16
    container_name: personal-finance-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: personal_finance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d personal_finance']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: personal-finance-backend
    restart: unless-stopped

    env_file:
      - .env.docker

    ports:
      - '3000:3000'

    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://localhost:${PORT:-3000}/api/health || exit 1',
        ]
      interval: 5s
      timeout: 3s
      retries: 5
  frontend:
    build:
      context: ../frontend
    container_name: personal-finance-frontend
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
