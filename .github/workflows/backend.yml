name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
  pull_request:
    paths:
      - 'apps/backend/**'
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: personal_finance_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d personal_finance_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/personal_finance_test?schema=public
      NODE_ENV: test
      JWT_ACCESS_SECRET: integration-test-access-secret
      JWT_REFRESH_SECRET: integration-test-refresh-secret
      JWT_2FA_SECRET: integration-test-two-factor-secret
      TWO_FACTOR_ENCRYPTION_KEY: BxwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBw=
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      BCRYPT_ROUNDS: 4
      FRONTEND_ORIGIN: http://localhost:5173
      GEMINI_API_KEY: integration-test-placeholder
      GEMINI_MODEL: integration-test-model

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run integration tests
        run: npm run test:integration
